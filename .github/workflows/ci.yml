name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install from Git
        run: python -m pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}" pytest
      - name: Unit tests
        run: python -m pytest
      - name: Installed app smoke test
        run: python -I scripts/smoke_install.py
