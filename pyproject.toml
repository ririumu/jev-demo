[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-demo"
version = "0.1.0"
description = "Local playground for TypeSafe Jev: typed decisions, not chat."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
jev-demo = "jev_demo.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
